  - answer: '1. Build and fully relax the B20/Ag3PO4(100)-H heterostructure model
      (3x3 supercell, 17.69x17.69x27.31 cubic angstroms, 15 angstrom vacuum) using
      VASP PBE-GGA + DFT-D3, 340 eV cutoff, convergence thresholds 1e-6 eV (energy)
      and 0.01 eV/angstrom (force). 2. Identify the equilibrium interfacial distance
      d_eq (approximately 2.02 angstroms for H configuration). 3. Generate a series
      of configurations by systematically shifting the B20 cluster relative to the
      surface along the z-direction, creating interfacial distances d = d_eq + delta
      for a range of delta values. 4. For each displaced configuration, perform single-point
      DFT calculations (same VASP settings) to obtain E_total(d). 5. Also compute
      E_B20 (isolated cluster) and E_Ag3PO4_surface (isolated slab). 6. Calculate
      formation/interaction energy: E(d) = E_total(d) - E_B20 - E_Ag3PO4_surface for
      each configuration. 7. Define r = d - d_eq and fit E(r) to Morse function using
      nonlinear least-squares regression. 8. Expected fitting parameters for H configuration:
      a=3.066, b=1.054, c=0.02848, d=0.02971 with R-squared=0.9992. 9. Coulomb and
      Lennard-Jones potentials were tested but did not well-describe the energy curve.
      The Morse potential is superior because it explicitly includes effects of bond
      breaking (unlike harmonic approximation) and captures both the attractive and
      repulsive regimes of the vdW interaction. The Ag3PO4(100) surface can be viewed
      as a rigid surface with B20 as an adsorbed molecule connected by a spring described
      by the Morse function.'
