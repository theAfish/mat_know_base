  - answer: '1. Build the Ag3PO4(100) surface slab model — this is the most stable
      among the low-index surfaces of Ag3PO4. Create a (3x3) supercell. 2. At the
      Ag3PO4(100) surface, Ag atoms form the outermost layer with surface coordination
      number of 2 (vs. 3 in bulk), making them unsaturated and electron-deficient.
      3. Construct the double-ring tubular B20 cluster with antiprism bonding motif:
      two parallel rings of 10 B atoms each connected by the antiprism pattern. This
      structure is the critical 2D-to-3D transition cluster (boron clusters prefer
      2D up to 19 atoms, 3D from 20 atoms). 4. Place the B20 cluster with its ring
      plane parallel (horizontal) to the Ag3PO4(100) surface, positioning it above
      the surface at an initial approximate interfacial distance. 5. Set the supercell
      dimensions to 17.69 x 17.69 x 27.31 cubic angstroms with 15 angstrom vacuum
      depth. 6. Perform DFT relaxation using VASP with PBE-GGA functional, DFT-D3
      Grimme vdW correction, 340 eV plane-wave cutoff, energy convergence below 1e-6
      eV, force convergence below 0.01 eV/angstrom. 7. After relaxation: approximately
      10 B atoms interact with the surface, two Ag atoms are dragged up approximately
      0.65 angstroms by the B20 cluster, and the equilibrium interfacial distance
      settles around 2.02 angstroms. The B20 cluster maintains its shape, confirming
      vdW (noncovalent) interaction.'
