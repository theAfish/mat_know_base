  - answer: '1. Build the anatase TiO2(101) surface slab — this is the dominating
      surface of the anatase phase, where O atoms form the topmost layer. 2. Place
      the double-ring tubular B20 cluster in both H (parallel) and V (perpendicular)
      orientations on the TiO2(101) surface. 3. Fully relax each configuration using
      VASP PBE-GGA + DFT-D3, 340 eV cutoff, energy convergence below 1e-6 eV, force
      convergence below 0.01 eV/angstrom. 4. Compute interaction potential energy
      curves by systematically varying the interfacial distance and performing single-point
      calculations at each distance, calculating E(d) = E_total - E_B20 - E_TiO2_surface.
      5. Fit each curve to Morse potential E(r) = a*[exp(-2b(r-c)) - 2*exp(-b(r-c))]
      + d. 6. Expected Morse parameters: TiO2-H: a=0.525, b=1.055, c=0.1794, d=0.0476,
      R-squared=0.9958; TiO2-V: a=0.525, b=1.367, c=-1.016, d=0.2207, R-squared=0.9995.
      7. The TiO2 interaction curves are more similar to B20/Ag3PO4-V (weak interaction)
      than B20/Ag3PO4-H (strong interaction) because TiO2(101) has O atoms at the
      topmost layer, which interact more weakly with B atoms than the unsaturated
      Ag atoms on Ag3PO4(100). The much smaller a parameter (0.525 vs 3.066 for Ag3PO4-H)
      reflects the weaker well depth. 8. The Morse function fits well for both substrates
      (R-squared greater than 0.96 for all configurations), suggesting general applicability
      to boron cluster/oxide interfaces and potentially other noncovalent heterostructures.'
