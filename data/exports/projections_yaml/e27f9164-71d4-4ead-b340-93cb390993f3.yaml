  - answer: 'Complete workflow: Phase 1 — Model Construction: Build (3x3) Ag3PO4(100)
      surface slab (most stable low-index surface) and double-ring tubular B20 cluster.
      Place B20 in H (ring plane parallel) and V (ring plane perpendicular) orientations.
      Set supercell 17.69x17.69x27.31 cubic angstroms with 15 angstrom vacuum. Phase
      2 — Relaxation: Relax both H and V configurations plus isolated B20 and Ag3PO4(100)
      surface using VASP PBE-GGA + DFT-D3, 340 eV cutoff, 1e-6 eV energy convergence,
      0.01 eV/angstrom force convergence. Phase 3 — Formation Energy: E_form = E_total(hetero)
      - E_B20 - E_Ag3PO4. H: -7.88 eV (strong, 10 B atoms interacting, d=2.02 angstroms);
      V: -0.19 eV (weak, approximately 5 B atoms, d=2.40 angstroms). Phase 4 — Electronic
      Structure: Compute band structure and PDOS for both configurations. H: VBM =
      B 2p + O 2p + Ag 4d, CBM = B 2p + Ag 5s, optical gap approximately 2.35 eV (O
      2p to B 2p). V: Type-II alignment — VBM = B 2p/2s, CBM = Ag 5s/O 2p. B20 levels
      embed within Ag3PO4 gap (2.18 eV), reducing heterostructure gap to 0.33-0.36
      eV, confirming B20 as charge-transfer sensitizer. Phase 5 — Charge Transfer:
      Bader analysis: H: 0.366 e (B20 to Ag3PO4); V: 0.080 e. Charge density difference
      shows accumulation above dragged-up Ag atoms (H: approximately 0.4 e/angstrom)
      and depletion below them. Phase 6 — Optical Properties: Fermi golden rule within
      dipole approximation; epsilon_2 from interband transitions, epsilon_1 from Kramers-Kronig.
      Enhanced absorption 380-700 nm (H stronger 400-580 nm, V stronger 580-800 nm).
      Phase 7 — Electrostatic Potential: Planar-averaged LOCPOT shows Ag3PO4 potential
      greater than B20 creating built-in potential. H config has more influence on
      lattice potential. Built-in potential well reduces carrier recombination. Conclusion:
      B20 serves as both sensitizer (embedding levels in Ag3PO4 gap) and cocatalyst
      (charged B atoms become active sites), with H configuration showing stronger
      interaction and V configuration showing more favorable Type-II alignment for
      charge separation.'
