      analysis on the CHGCAR files from each calculation. 4. Sum Bader charges on
      all 20 B atoms in each heterostructure configuration and subtract the total
      Bader charge on isolated B20 to get net transfer. 5. Expected results: H configuration
      shows 0.366 electrons transferred from B20 to Ag3PO4 (10 B atoms interacting
      with surface); V configuration shows 0.080 electrons transferred (approximately
      5 B atoms interacting). 6. Compute charge density difference: delta_rho = rho_hetero
      - rho_B20 - rho_Ag3PO4 by subtracting the charge density files. 7. Analyze spatial
