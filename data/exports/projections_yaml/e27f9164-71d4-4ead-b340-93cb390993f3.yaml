  - answer: '1. Relax the B20/Ag3PO4(100)-H heterostructure using VASP PBE-GGA + DFT-D3,
      340 eV cutoff, energy convergence below 1e-6 eV, force convergence below 0.01
      eV/angstrom. 2. Perform Mulliken population analysis on the plane-wave pseudopotential
      calculation results. 3. Extract Mulliken charges on specific atoms at the interface:
      (a) 2-fold coordinated Ag at pure surface: +0.56; (b) Ag atoms dragged up by
      B20 in H config: +0.99 (significant electron loss due to strong B20 interaction);
