  - answer: '1. Build and relax the B20/Ag3PO4(100)-V heterostructure (perpendicular
      orientation, approximately 5 B atoms interacting with surface, interfacial distance
      approximately 2.40 angstroms, formation energy approximately -0.19 eV) using
      VASP PBE-GGA + DFT-D3, 340 eV cutoff, energy convergence below 1e-6 eV, force
      convergence below 0.01 eV/angstrom. 2. Perform a self-consistent DFT calculation
      on the relaxed structure. 3. Compute the band structure along an appropriate
      k-point path for the heterostructure supercell. 4. Compute the PDOS decomposed
      by atom species (B, Ag, O, P) and by orbital (s, p, d). 5. Analyze the band
      edges: In the V configuration, the VBM is composed of B 2p and B 2s states from
      the B20 cluster; the CBM is composed of Ag 5s and O 2p states from Ag3PO4. 6.
      Both the CB and VB edges of Ag3PO4 lie below the corresponding B20 cluster counterparts
      — this is a Type-II staggered band alignment. 7. The Type-II alignment facilitates
      separation of photoexcited electron-hole pairs: electrons flow to Ag3PO4 CBM
      and holes remain at B20 VBM. 8. The heterostructure band gap is approximately
      0.36 eV (reduced from Ag3PO4 surface gap of 2.18 eV), because B20 energy levels
      embed within the Ag3PO4 gap.'
