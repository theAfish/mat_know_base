      vs z-position. 4. Identify potential regions: vacuum region, B₂₀ cluster region,
      Ag₃PO₄ slab region, and interfacial region. 5. Key finding: the planar average
      electrostatic potential at the Ag₃PO₄(100) surface is greater than at the B₂₀
      cluster, creating a large built-in potential between them. 6. The periodic lattice
