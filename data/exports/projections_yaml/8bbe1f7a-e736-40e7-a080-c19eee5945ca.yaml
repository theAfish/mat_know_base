  - answer: '1. Build the anatase TiO₂(101) slab model — this is the dominating surface
      of the anatase phase, with O atoms at the topmost layer. 2. Build both B₂₀/TiO₂
      configurations: H (ring plane parallel to surface) and V (ring plane perpendicular).
      3. Use VASP with PBE-GGA + DFT-D3 Grimme, 340 eV cutoff, convergence as specified.
      4. Relax both configurations. 5. For each configuration, systematically vary
      the interfacial distance between B₂₀ and TiO₂(101) surface and calculate single-point
      energies. 6. Compute interaction energies as E_interaction = E(heterostructure)
      - E(TiO₂ slab) - E(B₂₀). 7. Fit each energy curve to Morse potential E(r) =
      a·[exp(-2b(r-c)) - 2·exp(-b(r-c))] + d. 8. Expected Morse parameters: for H
