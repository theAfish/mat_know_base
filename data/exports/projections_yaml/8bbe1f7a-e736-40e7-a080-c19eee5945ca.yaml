  - answer: '1. Construct and relax both H and V configurations of B₂₀/Ag₃PO₄(100)
      heterostructure. 2. After relaxation, compare B₂₀ cluster structure in the heterostructure
      with isolated B₂₀: if B₂₀ maintains its shape and B atom positions (no significant
      deformation), this indicates vdW interaction rather than covalent bonding —
      this is the primary structural evidence. 3. Measure interfacial distances: H
      config ~2.02 Å, V config ~2.40 Å. These distances are consistent with vdW contacts
      rather than covalent bond lengths. 4. Perform Bader charge analysis: H config
      shows 0.366 e transfer, V config shows 0.080 e transfer. The relatively small
      charge transfer (vs full electron transfer in covalent bonds) supports vdW interaction.
      5. Calculate formation energies: H config -7.88 eV, V config -0.19 eV. These
      energies are consistent with vdW adhesion energies. 6. The Morse potential applicability
      (rather than covalent bond potentials) with high R² values also supports vdW
      nature. 7. Additional evidence: charge redistribution is localized at interface
      region, not distributed throughout B₂₀ as would happen in covalent bonding.'
