  - answer: '1. Build the Ag₃PO₄ bulk crystal structure and cleave along the (100)
      plane to create a slab model. The (100) surface is the most stable low-index
      surface. At this surface, Ag atoms are the outermost layer with coordination
      number 2 (compared to 3 in bulk). 2. Create a (3×3) surface supercell with dimensions
      ~17.69 × 17.69 Å. 3. Construct the double-ring tubular B₂₀ cluster: 20 boron
      atoms arranged in two parallel rings connected by an antiprism bonding motif.
      This represents the critical 2D-to-3D transition structure in boron clusters.
      4. Place the B₂₀ cluster above the Ag₃PO₄(100) slab with the ring plane parallel
      (horizontal) to the surface. 5. Add a 15 Å vacuum layer along the z-direction,
      giving total supercell volume ~17.69 × 17.69 × 27.31 Å³. 6. Run VASP DFT calculations
      with PBE-GGA functional + DFT-D3 Grimme vdW correction, plane-wave cutoff 340
      eV, energy convergence <10⁻⁶ eV, force convergence <0.01 eV/Å. 7. After relaxation,
      verify: B₂₀ retains its shape (vdW interaction, not covalent); ~10 B atoms interact
      with surface; interfacial distance ~2.02 Å; two Ag atoms are dragged up ~0.65
      Å by the B₂₀ cluster.'
    question: Construct the B₂₀/Ag₃PO₄(100)-H van der Waals heterostructure slab model
      for DFT calculation. The B₂₀ cluster is a double-ring tubular structure of 20
      boron atoms arranged in two parallel rings connected by an antiprism bonding
      motif. The Ag₃PO₄(100) surface is the most stable low-index surface of Ag₃PO₄.
      In the H (horizontal/parallel) configuration, the B₂₀ ring plane should be placed
      parallel to the Ag₃PO₄(100) surface. Use a (3×3) Ag₃PO₄(100) surface supercell
      with dimensions approximately 17.69 × 17.69 Å in the surface plane, and include
      a 15 Å vacuum layer along the z-direction to avoid artificial periodic interactions.
      The total supercell volume should be approximately 17.69 × 17.69 × 27.31 Å³.
