      Ag₃PO₄(100) surface ~2.18 eV; H heterostructure ~0.33 eV; V heterostructure
      ~0.36 eV. 4. The dramatic reduction from ~2.18 eV (surface) to ~0.33-0.36 eV
      (heterostructure) occurs because B₂₀ energy levels near the Fermi level are
      embedded within the band gap of Ag₃PO₄(100), forming the upper part of the valence
      band of the heterostructure. 5. B₂₀ acts as a charge-transfer sensitizer: in
      H config, large charge transfer leaves holes on B₂₀ making CBM formed by B 2p;
      in V config, weak interaction keeps electrons with B₂₀ making VBM formed by
      B 2p. 6. This band gap reduction mechanism enables the heterostructure to absorb
      light from visible to near-infrared.'
