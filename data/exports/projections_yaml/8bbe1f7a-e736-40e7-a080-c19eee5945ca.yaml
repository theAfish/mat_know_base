      3. Run a non-self-consistent band structure calculation along appropriate k-path
      for the surface/interface Brillouin zone. 4. Calculate PDOS by projecting density
      of states onto atomic orbitals (B 2s, B 2p, Ag 4d, Ag 5s, O 2p, P states). 5.
      Analyze results: The band gap should be ~0.36 eV. 6. Identify Type-II band alignment:
      both CB and VB edges of Ag₃PO₄ lie below the corresponding B₂₀ cluster counterparts,
      creating staggered alignment. 7. VBM composition: dominated by B 2p and B 2s
      states (B₂₀ cluster). 8. CBM composition: dominated by Ag 5s and O 2p states
      from Ag₃PO₄. This type-II alignment is beneficial for separation of photoexcited
      electron-hole pairs in photocatalysis.'
