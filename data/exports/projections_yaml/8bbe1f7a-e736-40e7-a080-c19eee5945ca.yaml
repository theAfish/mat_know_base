      a plane-wave cutoff energy of 340 eV, total energy convergence criterion of
      less than 10⁻⁶ eV, and force convergence criterion of less than 0.01 eV/Å. After
      relaxation, verify that the B₂₀ cluster maintains its structural integrity (vdW
      rather than covalent interaction) and that approximately 10 B atoms interact
