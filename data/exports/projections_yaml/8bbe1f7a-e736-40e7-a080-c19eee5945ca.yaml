  - answer: '1. Start from relaxed H and V heterostructure configurations. 2. In VASP,
      set up frequency-dependent dielectric function calculation (LOPTICS = True in
      INCAR). 3. The imaginary part ε₂(ω) is calculated from direct interband transitions
      using Fermi''s golden rule within dipole approximation. 4. The real part ε₁(ω)
      is obtained via Kramers-Kronig transformation of ε₂. 5. Calculate absorption
      coefficient α(ω) from the dielectric function. 6. For comparison, also calculate
      the optical absorption of pure Ag₃PO₄(100) surface (edge at 2.18 eV / ~569 nm).
      7. Expected results: Both heterostructures show dramatically enhanced visible-light
      response in 380-700 nm compared to pure Ag₃PO₄. The H configuration shows stronger
      absorption in 400-580 nm. The V configuration shows stronger absorption in 580-800
      nm (longer wavelength). The pure Ag₃PO₄ absorbs only part of visible light (<500
      nm) with weak intensity.'
