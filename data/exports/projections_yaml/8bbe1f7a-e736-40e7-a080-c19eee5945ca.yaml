  - answer: '1. Starting from the relaxed B₂₀/Ag₃PO₄(100)-H heterostructure, define
      the equilibrium interfacial distance (~2.02 Å between B₂₀ and surface). 2. Create
      a series of configurations by systematically displacing the B₂₀ cluster along
      the z-direction relative to the surface, varying the interfacial distance both
      above and below the equilibrium value. 3. For each configuration, perform single-point
      energy calculations in VASP with PBE-GGA + DFT-D3 Grimme, 340 eV cutoff, keeping
      atomic positions fixed. 4. Calculate the interaction energy at each distance
      as E_interaction = E(heterostructure) - E(Ag₃PO₄ slab) - E(B₂₀ cluster). 5.
      Plot the energy curve as a function of r (deviation from equilibrium distance).
      6. Fit the energy curve to the Morse potential E(r) = a·[exp(-2b(r-c)) - 2·exp(-b(r-c))]
      + d using nonlinear least-squares fitting. 7. For the H configuration, expect
      fitting parameters: a = 3.066, b = 1.054, c = 0.02848, d = 0.02971, with R²
      = 0.9992. 8. Compare with Coulomb and Lennard-Jones potentials, which do not
      well-describe the energy curve for this system.'
    question: Using VASP with PBE-GGA functional and DFT-D3 Grimme vdW correction
