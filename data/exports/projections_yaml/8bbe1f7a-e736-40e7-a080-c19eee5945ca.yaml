  - answer: '1. Relax both the pure Ag₃PO₄(100) surface slab and the B₂₀/Ag₃PO₄(100)-H
      heterostructure using same computational parameters. 2. Perform Mulliken population
      analysis on both systems (this requires plane-wave pseudopotential calculations
      as noted in the paper). 3. For pure surface: 3-fold coordinated O at top layer
      has charge -1.0; 2-fold coordinated Ag at top layer has charge +0.56. 4. For
      heterostructure: O atoms near B₂₀ become -0.97 and -0.96 (electron reduction
      due to B₂₀ interaction); Ag atoms dragged up by B₂₀ have charge +0.99 (more
      electrons lost due to stronger interaction vs +0.56 baseline). 5. B atoms nearest
      to Ag have large negative charges -0.26 and -0.23 (electron gain from Ag); B
      atoms at lower circumference have -0.03; B atoms at top circumference have +0.03.
      6. Key observation: stronger interaction in H config causes more electron loss
      from Ag atoms (+0.99 vs +0.56 baseline) and larger electron gain by nearby B
      atoms.'
