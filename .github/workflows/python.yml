name: Python distributions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install ".[dev]"
      - run: make check PYTHON=python
      - run: python -m build
      - run: python -m venv /tmp/mkb-consumer
      - run: /tmp/mkb-consumer/bin/python -m pip install dist/*.whl
      - run: cd /tmp && /tmp/mkb-consumer/bin/python "$GITHUB_WORKSPACE/examples/custom_storage.py"
      - run: for wheel in dist/*.whl; do /tmp/mkb-consumer/bin/python -m pip install "$wheel[sql]"; done
      - run: cd /tmp && /tmp/mkb-consumer/bin/python "$GITHUB_WORKSPACE/examples/extraction_quickstart.py"
      - run: cd /tmp && /tmp/mkb-consumer/bin/python "$GITHUB_WORKSPACE/examples/portable_quickstart.py"
