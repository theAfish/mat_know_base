services:
  # ── PostgreSQL + pgvector ────────────────────────────────────
  # The only stateful dependency: object bytes live in this database too.
  postgres:
    image: ${MKB_POSTGRES_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:0.8.0-pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MKB_PG_USER:?Set MKB_PG_USER in .env}
      POSTGRES_PASSWORD: ${MKB_PG_PASSWORD:?Set MKB_PG_PASSWORD in .env}
      POSTGRES_DB: ${MKB_PG_DATABASE:?Set MKB_PG_DATABASE in .env}
    ports:
      - "127.0.0.1:${MKB_PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
