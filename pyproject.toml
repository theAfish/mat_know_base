[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mat-know-base"
version = "0.1.0"
description = "Composable storage and agent extraction infrastructure for Python projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.18",
    "referencing>=0.28",
]

[project.optional-dependencies]
sql = ["sqlalchemy[asyncio]>=2.0"]
postgres = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
s3 = ["boto3>=1.34"]
agents = ["google-adk", "ddgs", "litellm>=1.75.5", "pydantic-settings[yaml]>=2.0"]
ocr = ["pillow>=10.0", "pytesseract>=0.3"]
pdf-local = ["mineru>=2.0"]
pdf = [
    "python-magic>=0.4",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-docx>=1.1",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "requests>=2.31",
]
server = [
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings[yaml]>=2.0",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "python-multipart>=0.0.20",
]
materials = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "boto3>=1.34",
    "python-magic>=0.4",
    "pydantic-settings[yaml]>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-docx>=1.1",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "mineru>=2.0",
    "google-adk",
    "ddgs",
    "litellm>=1.75.5",
    "requests>=2.31",
]
neo4j = ["neo4j>=5.0"]
all = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "boto3>=1.34",
    "python-magic>=0.4",
    "pydantic-settings[yaml]>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-docx>=1.1",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "mineru>=2.0",
    "google-adk",
    "ddgs",
    "litellm>=1.75.5",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "python-multipart>=0.0.20",
    "requests>=2.31",
]
dev = [
    "sqlalchemy[asyncio]>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
[project.scripts]
mkb = "mkb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
mkb = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Keep the established lint contract stable across Ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
