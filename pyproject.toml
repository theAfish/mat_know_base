[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mat-know-base"
version = "0.1.0"
description = "Scientific knowledge extraction and knowledge graph construction"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
s3 = ["boto3>=1.34"]
pdf = [
    "python-magic>=0.4",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-docx>=1.1",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "mineru>=2.0",
    "requests>=2.31",
]
server = [
    "pydantic-settings>=2.0",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "python-multipart>=0.0.20",
]
materials = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "boto3>=1.34",
    "python-magic>=0.4",
    "pydantic-settings>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-docx>=1.1",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "mineru>=2.0",
    "google-adk",
    "ddgs",
    "litellm>=1.75.5",
    "requests>=2.31",
]
neo4j = ["neo4j>=5.0"]
all = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "boto3>=1.34",
    "python-magic>=0.4",
    "pydantic-settings>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-docx>=1.1",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
    "mineru>=2.0",
    "google-adk",
    "ddgs",
    "litellm>=1.75.5",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "python-multipart>=0.0.20",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "ipython",
]
[project.scripts]
mkb = "mkb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
